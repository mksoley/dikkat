<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dikkat — Offline Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Inter", system-ui, sans-serif;
        background: #0b1020;
        color: #eef2ff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, rgba(59, 130, 246, 0.22), transparent 60%),
          linear-gradient(135deg, rgba(17, 24, 39, 0.7), rgba(15, 23, 42, 0.9));
      }
      .shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }
      .card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 18px 60px rgba(15, 23, 42, 0.15);
        backdrop-filter: blur(10px);
      }
      .grid {
        display: grid;
        gap: 20px;
      }
      .grid-two {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }
      .grid-three {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }
      .header h1 {
        margin: 8px 0 4px;
        font-size: 28px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .btn {
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(59, 130, 246, 0.7);
        color: white;
        font-weight: 600;
      }
      .btn.secondary {
        background: transparent;
      }
      .metric {
        display: flex;
        justify-content: space-between;
        padding: 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .chart {
        height: 180px;
        border-radius: 16px;
        background: linear-gradient(120deg, rgba(59, 130, 246, 0.3), rgba(139, 92, 246, 0.25));
        position: relative;
        overflow: hidden;
      }
      .chart canvas {
        position: absolute;
        inset: 0;
      }
      .footer-note {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div>
          <span class="pill">Offline Demo</span>
          <h1>Multimodal Attention Assessment</h1>
          <p>Decision-support screening — non-diagnostic performance assessment.</p>
        </div>
        <div>
          <button class="btn">Start Demo</button>
          <button class="btn secondary">Export Sample Data</button>
        </div>
      </header>

      <div class="grid grid-two">
        <section class="card">
          <h2>Live Signal Dashboard</h2>
          <div class="grid grid-two" id="metrics"></div>
          <p class="footer-note">Metrics update every 1.2s via demo simulation.</p>
        </section>
        <section class="card">
          <h2>Quality Signals</h2>
          <div class="chart">
            <canvas id="chart"></canvas>
          </div>
          <p class="footer-note">Visualizes rolling quality across modalities.</p>
        </section>
      </div>

      <section class="card" style="margin-top: 20px;">
        <h2>Protocol Timeline</h2>
        <div class="grid grid-three" id="timeline"></div>
      </section>
    </div>

    <script>
      const metricsEl = document.getElementById("metrics");
      const timelineEl = document.getElementById("timeline");
      const ctx = document.getElementById("chart").getContext("2d");

      const steps = [
        "Consent",
        "Environment Check",
        "Calibration",
        "CPT Block",
        "Micro Break",
        "Virtual Office",
        "Cooldown",
        "Results"
      ];

      steps.forEach((step) => {
        const card = document.createElement("div");
        card.className = "metric";
        card.innerHTML = `<div>${step}</div><strong>Ready</strong>`;
        timelineEl.appendChild(card);
      });

      const chartWidth = 600;
      const chartHeight = 180;
      ctx.canvas.width = chartWidth;
      ctx.canvas.height = chartHeight;

      const baseMetrics = {
        face: 0.96,
        gaze: 0.82,
        rppg: 0.74,
        noise: 32,
        frames: 0.012
      };

      const render = () => {
        metricsEl.innerHTML = "";
        const list = [
          { label: "Face Presence", value: `${Math.round(baseMetrics.face * 100)}%` },
          { label: "Gaze Stability", value: baseMetrics.gaze.toFixed(2) },
          { label: "rPPG SQI", value: baseMetrics.rppg.toFixed(2) },
          { label: "Ambient dB", value: `${baseMetrics.noise.toFixed(0)} dB` },
          { label: "Frame Drops", value: `${(baseMetrics.frames * 100).toFixed(1)}%` }
        ];
        list.forEach((metric) => {
          const item = document.createElement("div");
          item.className = "metric";
          item.innerHTML = `<div>${metric.label}</div><strong>${metric.value}</strong>`;
          metricsEl.appendChild(item);
        });

        ctx.clearRect(0, 0, chartWidth, chartHeight);
        const bars = [
          baseMetrics.face * 100,
          baseMetrics.gaze * 100,
          baseMetrics.rppg * 100,
          100 - baseMetrics.noise,
          (1 - baseMetrics.frames) * 100
        ];
        bars.forEach((value, index) => {
          const x = 40 + index * 110;
          const barHeight = (value / 100) * 120;
          ctx.fillStyle = ["#22c55e", "#38bdf8", "#a855f7", "#f97316", "#eab308"][index];
          ctx.fillRect(x, chartHeight - barHeight - 30, 40, barHeight);
        });
      };

      let t = 0;
      setInterval(() => {
        t += 1;
        baseMetrics.face = Math.min(0.99, Math.max(0.88, 0.95 + Math.sin(t / 8) * 0.02));
        baseMetrics.gaze = Math.min(0.9, Math.max(0.7, 0.8 + Math.cos(t / 12) * 0.05));
        baseMetrics.rppg = Math.min(0.85, Math.max(0.55, 0.72 + Math.sin(t / 10) * 0.08));
        baseMetrics.noise = Math.min(48, Math.max(24, 32 + Math.sin(t / 6) * 6));
        baseMetrics.frames = Math.min(0.03, Math.max(0.002, 0.012 + Math.cos(t / 5) * 0.004));
        render();
      }, 1200);

      render();
    </script>
  </body>
</html>
